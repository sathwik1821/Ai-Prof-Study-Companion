spring:
  application:
    name: ai-study-companion

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/study_companion}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:sathwikbodakunta2005@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:zlpnwybfxpcmihlq}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
    scheduling:
      pool:
        size: 3

# ============================================================
# JWT Configuration
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:your-very-long-and-secure-secret-key-that-should-be-at-least-256-bits-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

  # ============================================================
  # AI Configuration (Google Gemini)
  # ============================================================
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      text-model: gemini-flash-lite-latest
      embedding-model: gemini-embedding-001
      embedding-dimensions: 3072
      max-retries: 3
      timeout-seconds: 60

  # ============================================================
  # File Storage
  # ============================================================
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: 50

  # ============================================================
  # RAG Configuration
  # ============================================================
  rag:
    chunk-size: 400         # target tokens per chunk
    chunk-overlap: 50       # overlap tokens between chunks
    retrieval-top-k: 6      # number of chunks to retrieve

  # ============================================================
  # Email Delivery Configuration (HTTP REST API / Resend)
  # ============================================================
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    resend-from: ${RESEND_FROM:AiProf <onboarding@resend.dev>}

  # ============================================================
  # Background Jobs
  # ============================================================
  jobs:
    poll-interval-ms: 5000    # poll every 5 seconds
    retry-delay-seconds: 30   # delay before retry
    max-concurrent: 2         # concurrent job workers

# ============================================================
# Actuator
# ============================================================
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.aiprof: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
